server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: psy-trainer
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5444/psy}
    username: ${SPRING_DATASOURCE_USERNAME:psy}
    password: ${SPRING_DATASOURCE_PASSWORD:psy}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

psy:
  cors-origins: ${PSY_CORS_ORIGINS:http://localhost:5173,http://localhost}
  jwt:
    secret: ${PSY_JWT_SECRET:change-me-psy-jwt-secret-min-32-chars!!}
    issuer: ${PSY_JWT_ISSUER:psy-trainer}
    ttl-seconds: ${PSY_JWT_TTL_SECONDS:28800}
  auth-seed:
    admin-username: ${PSY_SEED_ADMIN_USERNAME:admin}
    admin-password: ${PSY_SEED_ADMIN_PASSWORD:change-me-strong-admin}
  qdrant:
    url: ${PSY_QDRANT_URL:http://localhost:6333}
    client-memory-collection: client_memory
    gestalt-knowledge-collection: gestalt_knowledge
    vector-size: ${PSY_VECTOR_SIZE:1536}
  knowledge-path: ${PSY_KNOWLEDGE_PATH:../docs/knowledge}
  minio:
    endpoint: ${PSY_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${PSY_MINIO_ACCESS_KEY:psy}
    secret-key: ${PSY_MINIO_SECRET_KEY:psysecret}
    bucket: ${PSY_MINIO_BUCKET:psy-prompts}
    enabled: ${PSY_MINIO_ENABLED:true}
