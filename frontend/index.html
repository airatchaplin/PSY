<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2f4a3c" />
    <meta name="description" content="Учебный симулятор гештальт-практики: чат с ИИ-клиентом, супервизор и разбор сеансов." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PSY" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/pwa-64x64.png" />
    <title>PSY — тетрадь практики</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Serif:ital@0;1&family=Mulish:wght@400;500;600;700&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&family=Roboto:wght@400;500;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('psy.theme')
          var fixed = t === 'rose' || t === 'masculine' || t === 'feminine' || t === 'white' || t === 'black'
            || t === 'ios-light' || t === 'ios-dark'
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = fixed ? t : (dark ? 'ios-dark' : 'ios-light')
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = (theme === 'ios-dark' || theme === 'black') ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'ios-light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
