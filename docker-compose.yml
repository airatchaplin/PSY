services:
  vault:
    image: hashicorp/vault:1.18
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-psy-local-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    command: server -dev -dev-root-token-id=${VAULT_TOKEN:-psy-local-root}
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 20

  vault-init:
    image: hashicorp/vault:1.18
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-psy-local-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psy}
      PSY_MINIO_SECRET_KEY: ${PSY_MINIO_SECRET_KEY:-psysecret}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      PSY_LLM_API_KEY: ${PSY_LLM_API_KEY:-}
    volumes:
      - ./docker/vault/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-psy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psy}
      POSTGRES_DB: ${POSTGRES_DB:-psy}
    ports:
      - "5444:5432"
    volumes:
      - psy_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psy} -d ${POSTGRES_DB:-psy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.20.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - psy_qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: ${PSY_MINIO_IMAGE:-minio/minio:latest}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${PSY_MINIO_ACCESS_KEY:-psy}
      MINIO_ROOT_PASSWORD: ${PSY_MINIO_SECRET_KEY:-psysecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - psy_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    entrypoint: ["/bin/sh", "/opt/keycloak/data/import-src/import-realm.sh"]
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_THERAPIST_PASSWORD: ${KEYCLOAK_THERAPIST_PASSWORD:-therapist}
      KEYCLOAK_USER_ADMIN_PASSWORD: ${KEYCLOAK_USER_ADMIN_PASSWORD:-admin}
      PSY_API_CLIENT_SECRET: ${PSY_API_CLIENT_SECRET:-psy-api-secret}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HOSTNAME_PORT: ${KC_HOSTNAME_PORT:-8082}
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8082:8080"
    volumes:
      - ./docker/keycloak/realm-psy.json.template:/opt/keycloak/data/import-src/realm-psy.json.template:ro
      - ./docker/keycloak/import-realm.sh:/opt/keycloak/data/import-src/import-realm.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      keycloak:
        condition: service_started
      vault-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-psy}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-psy}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-psy}
      SERVER_PORT: 8081
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${VITE_KEYCLOAK_URL:-http://localhost:8082}/realms/psy
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/psy/protocol/openid-connect/certs
      SPRING_CLOUD_VAULT_URI: http://vault:8200
      SPRING_CLOUD_VAULT_TOKEN: ${VAULT_TOKEN:-psy-local-root}
      SPRING_CLOUD_VAULT_KV_ENABLED: "true"
      SPRING_CLOUD_VAULT_KV_BACKEND: secret
      SPRING_CLOUD_VAULT_KV_DEFAULT_CONTEXT: psy
      SPRING_CONFIG_IMPORT: optional:vault://
      PSY_QDRANT_URL: http://qdrant:6333
      PSY_KNOWLEDGE_PATH: /app/knowledge
      PSY_CORS_ORIGINS: ${PSY_CORS_ORIGINS:-http://localhost:5173,http://localhost,http://127.0.0.1:5173,http://127.0.0.1}
      PSY_MINIO_ENABLED: "true"
      PSY_MINIO_ENDPOINT: http://minio:9000
      PSY_MINIO_ACCESS_KEY: ${PSY_MINIO_ACCESS_KEY:-psy}
      PSY_MINIO_SECRET_KEY: ${PSY_MINIO_SECRET_KEY:-psysecret}
      PSY_MINIO_BUCKET: ${PSY_MINIO_BUCKET:-psy-prompts}
      PSY_KEYCLOAK_ADMIN_URL: http://keycloak:8080
      PSY_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-psy}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8081:8081"
    volumes:
      - ./docs/knowledge:/app/knowledge:ro

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8081}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8082}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-psy}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-psy-web}
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  psy_pg:
  psy_qdrant:
  psy_minio:
